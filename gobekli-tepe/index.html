<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Göbekli Tepe VR</title>
<style>
  html,body{margin:0;height:100%;background:#14110d;color:#eee;font:15px/1.4 system-ui,sans-serif;overflow:hidden}
  canvas{display:block}
  #ui{position:fixed;left:16px;bottom:16px;max-width:420px;background:#000a;padding:12px 14px;border-radius:8px}
  #ui a{color:#f0c27a}
  #bar{height:6px;background:#444;border-radius:3px;margin:8px 0 4px;overflow:hidden}
  #bar div{height:100%;width:0;background:#f0c27a}
  #msg{font-size:13px;opacity:.85}
</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
}}
</script>
</head>
<body>
<div id="ui">
  <strong>Göbekli Tepe</strong> — VR walk-around test
  <div id="bar"><div></div></div>
  <div id="msg">Loading model…</div>
  <div style="font-size:12px;margin-top:6px;opacity:.8">
    Quest: left stick move · right stick turn/up-down · trigger = sprint · A/B = up/down · right stick click = back to start<br>
    Desktop: WASD + drag to look · Shift = sprint · Q/E = down/up<br>
    Model: <a href="https://sketchfab.com/3d-models/gobekli-tepe-5a4d25c355ff48d59ab76c36812b9cf3">“Gobekli Tepe”</a>
    by <a href="https://sketchfab.com/rmark">rmark</a>,
    <a href="http://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>
  </div>
</div>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {VRButton} from 'three/addons/webxr/VRButton.js';

const bar = document.querySelector('#bar div'), msg = document.querySelector('#msg');
const renderer = new THREE.WebGLRenderer({antialias:false, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
renderer.xr.setFoveation(1);
document.body.appendChild(renderer.domElement);
document.body.appendChild(VRButton.createButton(renderer));

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fc3e0);
const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.05, 1000);
const rig = new THREE.Group();          // moving the rig moves the player
rig.add(camera);
scene.add(rig);

const clock = new THREE.Clock();
let start = new THREE.Vector3(), model = null;

function creditPanel(at){
  const c = document.createElement('canvas'); c.width = 1024; c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = '#000c'; g.fillRect(0,0,1024,256);
  g.fillStyle = '#fff'; g.font = '48px sans-serif';
  g.fillText('“Gobekli Tepe” by rmark', 40, 100);
  g.font = '34px sans-serif';
  g.fillText('CC BY 4.0 — sketchfab.com/rmark', 40, 160);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 0.4),
    new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(c), transparent:true}));
  m.position.copy(at).add(new THREE.Vector3(0, 1.4, -2));
  scene.add(m);
}

new GLTFLoader().load('gobekli_tepe_quest3.glb', gltf => {
  model = gltf.scene;
  scene.add(model);
  const box = new THREE.Box3().setFromObject(model);
  const c = box.getCenter(new THREE.Vector3());
  // spawn high on the south side looking toward the site; fly down with the right stick / A,B
  start.set(c.x, box.max.y + 30, c.z + 110);
  rig.position.copy(start);
  creditPanel(start);
  msg.textContent = `Loaded. Model is ${(box.max.x-box.min.x).toFixed(0)} × ${(box.max.z-box.min.z).toFixed(0)} m. Press “Enter VR” (bottom of page).`;
  bar.style.width = '100%';
}, e => {
  if (e.lengthComputable){
    bar.style.width = (100*e.loaded/e.total).toFixed(1)+'%';
    msg.textContent = `Loading model… ${(e.loaded/1e6).toFixed(0)} / ${(e.total/1e6).toFixed(0)} MB`;
  } else msg.textContent = `Loading model… ${(e.loaded/1e6).toFixed(0)} MB`;
}, err => { msg.textContent = 'Failed to load model: ' + (err.message || err); console.error(err); });

// ---- desktop controls ----
const keys = {}; let yaw = 0, pitch = 0, drag = false;
addEventListener('keydown', e => keys[e.code] = true);
addEventListener('keyup', e => keys[e.code] = false);
renderer.domElement.addEventListener('pointerdown', () => drag = true);
addEventListener('pointerup', () => drag = false);
addEventListener('pointermove', e => { if (!drag) return; yaw -= e.movementX*0.003; pitch = Math.max(-1.5, Math.min(1.5, pitch - e.movementY*0.003)); });
addEventListener('resize', () => { camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

// ---- movement ----
const fwd = new THREE.Vector3(), right = new THREE.Vector3(), up = new THREE.Vector3(0,1,0), tmp = new THREE.Vector3();
let snapReady = true, resetReady = true;
const DEAD = 0.15;
const dz = v => Math.abs(v) < DEAD ? 0 : v;

function move(dt, x, z, y, sprint){
  const speed = sprint ? 12 : 3;
  camera.getWorldDirection(fwd); fwd.y = 0;
  if (fwd.lengthSq() < 1e-6) return;
  fwd.normalize(); right.crossVectors(fwd, up);
  rig.position.addScaledVector(right, x*speed*dt).addScaledVector(fwd, -z*speed*dt);
  rig.position.y += y*speed*dt;
}

renderer.setAnimationLoop((t, frame) => {
  const dt = Math.min(clock.getDelta(), 0.1);
  if (renderer.xr.isPresenting){
    const session = renderer.xr.getSession();
    let sprint = false;
    for (const src of session.inputSources){
      const gp = src.gamepad; if (!gp) continue;
      const ax = gp.axes, b = gp.buttons;
      const sx = dz(ax[2]||0), sy = dz(ax[3]||0);
      if (b[0] && b[0].pressed) sprint = true;
      if (src.handedness === 'left'){
        move(dt, sx, sy, 0, sprint);
      } else if (src.handedness === 'right'){
        // right stick: left/right = snap turn, forward/back = up/down
        if (Math.abs(sx) > 0.7 && snapReady){
          snapReady = false;
          camera.getWorldPosition(tmp);
          const a = -Math.sign(sx) * Math.PI/6;
          rig.position.sub(tmp).applyAxisAngle(up, a).add(tmp);
          rig.rotateOnWorldAxis(up, a);
        } else if (Math.abs(sx) < 0.3) snapReady = true;
        rig.position.y += -sy * (sprint?12:3) * dt;
        const up_ = b[4] && b[4].pressed, down_ = b[5] && b[5].pressed;
        if (up_) rig.position.y += 3*dt;
        if (down_) rig.position.y -= 3*dt;
        if (b[3] && b[3].pressed){ if (resetReady){ rig.position.copy(start); rig.rotation.set(0,0,0); resetReady = false; } }
        else resetReady = true;
      }
    }
  } else {
    camera.rotation.set(pitch, yaw, 0, 'YXZ');
    camera.position.set(0, 1.7, 0);
    const sprint = keys.ShiftLeft || keys.ShiftRight;
    move(dt, (keys.KeyD?1:0)-(keys.KeyA?1:0), (keys.KeyS?1:0)-(keys.KeyW?1:0), (keys.KeyE?1:0)-(keys.KeyQ?1:0), sprint);
  }
  renderer.render(scene, camera);
});
</script>
</body>
</html>
